<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9e2d5">
  <meta name="description" content="乱记：把念头先放下。">
  <title>乱记 · 把念头先放下</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%239f3927'/%3E%3Ctext x='32' y='43' font-size='34' text-anchor='middle' fill='%23fff6ee' font-family='KaiTi,STKaiti,serif'%3E%E4%B9%B1%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css?v=8">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="./" aria-label="乱记，回到正在写的纸">
      <span class="seal" aria-hidden="true">乱</span>
      <span class="brand-name">乱记</span>
    </a>
    <div class="topbar-right">
      <span class="local-status" id="local-status">只在本机</span>
      <button class="text-action" id="btn-settings" type="button">设置</button>
    </div>
  </header>

  <main class="workspace">
    <div class="scene-intro" aria-live="polite">
      <span class="scene-kicker">此刻</span>
      <span id="save-state">草稿会自动留在本机</span>
    </div>

    <section class="paper-wrap" aria-label="正在写的这张纸">
      <article class="paper" id="paper">
        <div class="paper-topline">
          <span class="paper-label" id="paper-label">一张新纸</span>
          <button class="paper-quiet-action" id="btn-clear-draft" type="button" hidden>清掉草稿</button>
        </div>
        <textarea id="write" spellcheck="false" autocomplete="off" autocapitalize="sentences"
          aria-label="想到什么，就写一下"
          placeholder="想到什么，就写一下。"></textarea>
        <div class="paper-shots" id="paper-shots" aria-label="贴在这张纸上的图" hidden></div>
        <div class="paper-bottomline">
          <span class="writing-hint" id="writing-hint">不必起标题，也不必想完整。</span>
          <span class="bottomline-actions">
            <button class="shot-button" id="btn-shot" type="button">贴一张</button>
            <button class="drop-button" id="btn-drop" type="button" disabled>
              <span>放下</span><kbd>⌘↵</kbd>
            </button>
          </span>
        </div>
      </article>

      <section class="stack-area" aria-label="纸摞">
        <div class="stack-heading">
          <span class="stack-title">纸摞</span>
          <span class="stack-note" id="stack-note">写下的会一直在这里</span>
        </div>
        <div class="stack" id="stack"></div>
        <button class="stack-link" id="btn-pile" type="button">看看最近</button>
      </section>
    </section>
  </main>

  <nav class="review-nav" aria-label="回看">
    <button class="review-button" id="btn-flip" type="button">
      <span class="review-name">翻一翻</span>
      <span class="review-desc">不知道会遇见什么</span>
    </button>
    <button class="review-button" id="btn-search" type="button">
      <span class="review-name">找一下</span>
      <span class="review-desc">大概记得，但不记得原话</span>
    </button>
  </nav>

  <div class="overlay" id="ov-flip" role="dialog" aria-modal="true" aria-labelledby="flip-title" hidden></div>
  <div class="overlay" id="ov-recent" role="dialog" aria-modal="true" aria-labelledby="recent-title" hidden></div>
  <div class="overlay" id="ov-search" role="dialog" aria-modal="true" aria-labelledby="search-title" hidden></div>
  <div class="overlay" id="ov-read" role="dialog" aria-modal="true" aria-labelledby="read-title" hidden></div>
  <div class="overlay" id="ov-settings" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input id="shot-file" type="file" accept="image/*" multiple hidden>

  <script src="assets/ai.js?v=4"></script>
  <script src="assets/ocr.js?v=1"></script>
  <script src="assets/app.js?v=7"></script>
</body>
</html>
